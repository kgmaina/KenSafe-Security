<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KenSafe Security</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="index.js"></script>
</head>
<body>
    <header>
 <h1><img src="assets/logo1.png" alt="logo image" width="30" height="30">KenSafe Security</h1>
 <p id="nav">An online security management system for gated communities.</p>
 <img src="assets/banner-3.png" alt="Security banner" width="1200" height="200">
     </header>
<div class="features">
    <div>
        <form style="display: grid; gap: 5px;">
            <label for="registration">Car Registration:</label><br>
            <input type="text" id="reg" name="registration">
        </form>
        <button type="button">Search</button></div>
    <div>
        <form style="display: grid; gap: 5px;">
         <label for="idNum">Id Number:</label><br>
         <input type="text" id="idNum" name="idNumber">
        </form>
        <button type="button">Search</button></div>
    <div>
        <form style="display: grid; gap: 5px;">
         <label for="hse">House Number:</label><br>
         <input type="text" id="hse" name="houseNumber">
        </form>
        <button type="button">Search</button></div>
</div>
<div class="add"><p><a href="">Click here to add a new resident to the data base</a></p></div>

</body>
</html>
